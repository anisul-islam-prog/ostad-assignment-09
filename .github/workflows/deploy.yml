name: CI/CD — Deploy to AWS

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  S3_BUCKET: ostad-assignment-09-artifacts-2a4b240b   # <-- REPLACE with your actual bucket

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend   # <-- ALL run steps now run in backend/

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json   # <-- TELL IT WHERE TO LOOK

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test || echo "No tests yet, skipping"

      - name: Build Artifact
        run: |
          npm ci --production
          mkdir -p ../release
          tar -czf ../release/backend.tar.gz .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        working-directory: ${{ github.workspace }}   # <-- Back to repo root for S3 upload
        run: |
          aws s3 cp release/backend.tar.gz s3://${{ env.S3_BUCKET }}/releases/backend-${{ github.sha }}.tar.gz

  deploy-backend:
    name: Deploy to ASG
    needs: build-backend
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger ASG Instance Refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ secrets.BACKEND_ASG_NAME }} \
            --preferences "MinHealthyPercentage=50,InstanceWarmup=120" \
            --strategy Rolling

      - name: Wait for Deployment
        run: |
          sleep 30
          REFRESH_ID=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name ${{ secrets.BACKEND_ASG_NAME }} \
            --query 'InstanceRefreshes[0].InstanceRefreshId' \
            --output text)
          echo "Refresh ID: $REFRESH_ID"
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ secrets.BACKEND_ASG_NAME }} \
              --instance-refresh-ids $REFRESH_ID \
              --query 'InstanceRefreshes[0].Status' \
              --output text)
            echo "Status: $STATUS"
            if [ "$STATUS" == "Successful" ]; then
              echo "✅ Instance refresh complete!"
              break
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ]; then
              echo "❌ Instance refresh failed!"
              exit 1
            fi
            sleep 30
          done

      - name: Verify Deployment
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names ostad-assignment-09-backend-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          echo "ALB DNS: $ALB_DNS"
          sleep 60
          RETRIES=0
          MAX_RETRIES=10
          while [ $RETRIES -lt $MAX_RETRIES ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$ALB_DNS/health || echo "000")
            if [ "$STATUS" == "200" ]; then
              echo "✅ Health check passed!"
              curl -s http://$ALB_DNS/api/deployment-info
              break
            fi
            echo "Health check returned $STATUS, retrying in 15s..."
            RETRIES=$((RETRIES+1))
            sleep 15
          done
          if [ $RETRIES -eq $MAX_RETRIES ]; then
            echo "❌ Health check failed after $MAX_RETRIES attempts"
            exit 1
          fi