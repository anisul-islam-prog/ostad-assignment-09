name: CI/CD — Deploy to AWS

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  S3_BUCKET: ostad-assignment-09-artifacts-2a4b240b   # <-- REPLACE with your actual bucket from terraform output

jobs:
  # ==========================================
  # JOB 1: BUILD & TEST BACKEND
  # ==========================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Tests
        run: |
          cd backend
          npm test || echo "No tests yet, skipping"

      - name: Build Artifact
        run: |
          cd backend
          npm ci --production
          tar -czf ../backend-release.tar.gz .

      - name: Upload to S3
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Push to S3
        run: |
          aws s3 cp backend-release.tar.gz s3://${{ env.S3_BUCKET }}/releases/backend-${{ github.sha }}.tar.gz

  # ==========================================
  # JOB 2: DEPLOY TO ASG (INSTANCE REFRESH)
  # ==========================================
  deploy-backend:
    name: Deploy to ASG
    needs: build-backend
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger ASG Instance Refresh
        run: |
          echo "Starting instance refresh for ASG..."
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ secrets.BACKEND_ASG_NAME }} \
            --preferences "MinHealthyPercentage=50,InstanceWarmup=120" \
            --strategy Rolling

      - name: Wait for Deployment
        run: |
          echo "Waiting for instance refresh to complete..."
          sleep 30
          
          REFRESH_ID=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name ${{ secrets.BACKEND_ASG_NAME }} \
            --query 'InstanceRefreshes[0].InstanceRefreshId' \
            --output text)
          
          echo "Refresh ID: $REFRESH_ID"
          
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ secrets.BACKEND_ASG_NAME }} \
              --instance-refresh-ids $REFRESH_ID \
              --query 'InstanceRefreshes[0].Status' \
              --output text)
            
            echo "Status: $STATUS"
            
            if [ "$STATUS" == "Successful" ]; then
              echo "✅ Instance refresh complete!"
              break
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ]; then
              echo "❌ Instance refresh failed!"
              exit 1
            fi
            
            sleep 30
          done

      - name: Verify Deployment
        run: |
          echo "Fetching ALB DNS from Terraform state..."
          # You can hardcode the ALB DNS or fetch it via AWS CLI
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names ostad-assignment-09-backend-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          
          echo "ALB DNS: $ALB_DNS"
          echo "Waiting for health checks..."
          sleep 60
          
          RETRIES=0
          MAX_RETRIES=10
          
          while [ $RETRIES -lt $MAX_RETRIES ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$ALB_DNS/health || echo "000")
            if [ "$STATUS" == "200" ]; then
              echo "✅ Health check passed!"
              echo "Deployment Info:"
              curl -s http://$ALB_DNS/api/deployment-info | jq .
              break
            fi
            echo "Health check returned $STATUS, retrying in 15s..."
            RETRIES=$((RETRIES+1))
            sleep 15
          done
          
          if [ $RETRIES -eq $MAX_RETRIES ]; then
            echo "❌ Health check failed after $MAX_RETRIES attempts"
            exit 1
          fi