name: CI/CD — Deploy to AWS

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  S3_BUCKET: ostad-assignment-09-artifacts-2a4b240b   # <-- REPLACE with your bucket

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test || echo "No tests yet, skipping"

      - name: Build Artifact
        run: |
          npm ci --production
          mkdir -p ../release
          tar -czf ../release/backend.tar.gz .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        working-directory: ${{ github.workspace }}
        run: |
          aws s3 cp release/backend.tar.gz s3://${{ env.S3_BUCKET }}/releases/backend-${{ github.sha }}.tar.gz

  deploy-backend:
    name: Deploy to ASG
    needs: build-backend
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger ASG Instance Refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ secrets.BACKEND_ASG_NAME }} \
            --preferences "MinHealthyPercentage=50,InstanceWarmup=120" \
            --strategy Rolling

      - name: Wait for Deployment
        run: |
          sleep 30
          REFRESH_ID=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name ${{ secrets.BACKEND_ASG_NAME }} \
            --query 'InstanceRefreshes[0].InstanceRefreshId' \
            --output text)
          echo "Refresh ID: $REFRESH_ID"
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ secrets.BACKEND_ASG_NAME }} \
              --instance-refresh-ids $REFRESH_ID \
              --query 'InstanceRefreshes[0].Status' \
              --output text)
            echo "Status: $STATUS"
            if [ "$STATUS" == "Successful" ]; then
              echo "✅ Instance refresh complete!"
              break
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ]; then
              echo "❌ Instance refresh failed!"
              exit 1
            fi
            sleep 30
          done

      - name: Verify Deployment via Frontend
        run: |
          FRONTEND_DNS=$(aws elbv2 describe-load-balancers \
            --names ostad-assignment-09-frontend-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          
          echo "Frontend ALB: $FRONTEND_DNS"
          echo "Waiting for health checks..."
          sleep 90
          
          RETRIES=0
          MAX_RETRIES=10
          
          while [ $RETRIES -lt $MAX_RETRIES ]; do
            # Check frontend loads
            FRONT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$FRONTEND_DNS/ || echo "000")
            echo "Frontend status: $FRONT_STATUS"
            
            if [ "$FRONT_STATUS" == "200" ]; then
              echo "✅ Frontend is responding!"
              
              # Check deployment info through frontend proxy
              DEPLOY_INFO=$(curl -s http://$FRONTEND_DNS/api/deployment-info || echo "failed")
              echo "Deployment Info: $DEPLOY_INFO"
              
              if echo "$DEPLOY_INFO" | grep -q "version"; then
                echo "✅ Deployment verified successfully!"
                break
              fi
            fi
            
            echo "Retrying in 15s..."
            RETRIES=$((RETRIES+1))
            sleep 15
          done
          
          if [ $RETRIES -eq $MAX_RETRIES ]; then
            echo "❌ Verification failed"
            exit 1
          fi